name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Ручной запуск: Actions → CI → Run workflow. Всегда собирает установщик.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Проверки, сайт и интерфейс приложения
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Проверки типов
        run: pnpm -r check

      - name: Сборка сайта
        run: pnpm --filter web build

      - name: Сборка интерфейса приложения
        run: pnpm --filter desktop build

  # Сборка под Windows идёт долго, а в приватном репозитории её минуты считаются вдвойне.
  # Поэтому установщик собирается, только если менялось то, из чего он состоит.
  changes:
    name: Что изменилось
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        name: Нужно ли собирать установщик
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          desktop=true
          if [ "$EVENT" != "workflow_dispatch" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$BASE" "$GITHUB_SHA" \
              | grep -qE '^(app/|packages/ui/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/)'; then
              desktop=false
            fi
          fi
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "Собирать установщик: $desktop"

  desktop:
    name: ПК-приложение — установщик для Windows
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      # Публичные значения, те же, что у сайта. Задаются в настройках репозитория:
      # Settings → Secrets and variables → Actions → Variables.
      PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Предупреждение, если не заданы переменные Supabase
        if: env.PUBLIC_SUPABASE_URL == '' || env.PUBLIC_SUPABASE_PUBLISHABLE_KEY == ''
        shell: bash
        run: echo "::warning title=Приложение собрано без Supabase::Не заданы переменные репозитория PUBLIC_SUPABASE_URL и PUBLIC_SUPABASE_PUBLISHABLE_KEY. Установщик соберётся, но приложение покажет «Supabase не подключён»."

      - name: Сборка установщика
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter desktop tauri build 2>&1 | tee "$RUNNER_TEMP/tauri-build.log"

      - name: Причина ошибки сборки
        if: failure()
        shell: bash
        run: |
          log="$RUNNER_TEMP/tauri-build.log"
          [ -f "$log" ] || exit 0
          # Последние строки с ошибками попадают в аннотацию: её видно прямо на странице PR.
          text=$(grep -aE -A6 '^(error|Error)|error\[|failed to|ERR_' "$log" | tail -n 60)
          [ -n "$text" ] || text=$(tail -n 40 "$log")
          text="${text//'%'/'%25'}"
          text="${text//$'\r'/}"
          text="${text//$'\n'/'%0A'}"
          echo "::error title=Сборка приложения не прошла::$text"

      - name: Установщик и Cargo.lock
        uses: actions/upload-artifact@v4
        with:
          name: axo-team-windows
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 14
